<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="44 12 720 404" role="img" aria-label="A developer seen from behind sipping coffee, centred in front of a laptop set just below a monitor">
<style>
  .type{animation:type 1.8s steps(1) infinite}
  .t2{animation-delay:.25s}.t3{animation-delay:.5s}.t4{animation-delay:.75s}.t5{animation-delay:1s}.t6{animation-delay:1.25s}
  @keyframes type{0%{opacity:.25}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .err{animation:err 2.4s steps(1) infinite}
  @keyframes err{0%{opacity:1}50%{opacity:.15}}
  .sip{transform-origin:460px 270px;animation:sip 4s ease-in-out infinite}
  @keyframes sip{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(6deg)}}
  .head{transform-origin:503px 240px;animation:tilt 4s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-3deg) translateY(-1px)}}
  .steam{animation:steam 2.2s ease-in-out infinite}
  .s2{animation-delay:.7s}.s3{animation-delay:1.4s}
  @keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.75}100%{transform:translateY(-16px);opacity:0}}
  .spin{transform-origin:110px 92px;animation:spin 1.2s linear infinite}
  .spin2{transform-origin:110px 92px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{animation:bar 3s ease-in-out infinite}
  @keyframes bar{0%{width:0}80%,100%{width:56px}}
</style>

<rect x="44" y="12" width="720" height="404" rx="18" fill="#0B0F0D"/>
<g fill="#1A221E">
  <circle cx="40" cy="30" r="1.4"/><circle cx="220" cy="40" r="1.4"/><circle cx="700" cy="30" r="1.4"/><circle cx="760" cy="200" r="1.4"/><circle cx="60" cy="260" r="1.4"/><circle cx="200" cy="150" r="1.4"/>
</g>
<line x1="20" y1="384" x2="780" y2="384" stroke="#1F2924" stroke-width="2"/>

<!-- wall clock -->
<circle cx="110" cy="92" r="36" fill="#121915" stroke="#2C3A33" stroke-width="3"/>
<g stroke="#3A4840" stroke-width="2"><line x1="110" y1="60" x2="110" y2="66"/><line x1="110" y1="118" x2="110" y2="124"/><line x1="78" y1="92" x2="84" y2="92"/><line x1="136" y1="92" x2="142" y2="92"/></g>
<line class="spin2" x1="110" y1="92" x2="110" y2="73" stroke="#ECEFE9" stroke-width="3" stroke-linecap="round"/>
<line class="spin" x1="110" y1="92" x2="110" y2="65" stroke="#C6F25A" stroke-width="2" stroke-linecap="round"/>
<circle cx="110" cy="92" r="3" fill="#C6F25A"/>

<!-- deadline note -->
<g transform="rotate(5 694 92)">
  <rect x="656" y="62" width="78" height="60" rx="3" fill="#FFB547"/>
  <text x="695" y="87" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#2A1C05">DEADLINE</text>
  <text x="695" y="105" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#B3261E">TODAY!</text>
</g>

<!-- desk -->
<rect x="150" y="272" width="560" height="12" rx="4" fill="#2E3A33"/>
<rect x="164" y="284" width="10" height="100" fill="#24302A"/>
<rect x="686" y="284" width="10" height="100" fill="#24302A"/>

<!-- monitor (centred) -->
<rect x="384" y="24" width="240" height="144" rx="8" fill="#1C2420"/>
<rect x="394" y="34" width="220" height="124" rx="3" fill="#0F1512"/>
<rect x="494" y="168" width="20" height="8" fill="#1C2420"/>
<g font-family="monospace" font-size="10">
  <text class="type" x="406" y="52" fill="#C6F25A">def deploy():</text>
  <text class="type t2" x="420" y="66" fill="#9AA39C">run_tests()</text>
  <text class="type t3" x="420" y="80" fill="#9AA39C">build()</text>
  <text class="type t4" x="420" y="94" fill="#FFB547">push("prod")</text>
  <text class="err" x="406" y="112" fill="#FF6B5E">x 3 tests failed</text>
  <text class="type t5" x="406" y="126" fill="#9AA39C">$ git commit -m "fix"</text>
  <text class="type t6" x="406" y="140" fill="#C6F25A">$ retrying...</text>
</g>
<rect class="blink" x="488" y="132" width="7" height="10" fill="#C6F25A"/>

<!-- laptop, just below the monitor (centred) -->
<rect x="396" y="174" width="216" height="92" rx="6" fill="#2A3530"/>
<rect x="404" y="181" width="200" height="78" rx="2" fill="#0F1512"/>
<g font-family="monospace" font-size="8.5">
  <text x="412" y="194" fill="#9AA39C">run #42</text>
  <text x="596" y="194" text-anchor="end" fill="#7DD3FC">deploying...</text>
</g>
<rect x="412" y="200" width="56" height="5" rx="2.5" fill="#1C2420"/>
<rect class="bar" x="412" y="200" width="56" height="5" rx="2.5" fill="#C6F25A"/>
<path d="M382 266 H626 L634 272 H374 Z" fill="#3A4840"/>

<!-- plant -->
<rect x="650" y="248" width="26" height="24" rx="4" fill="#3A4840"/>
<path d="M663 248 q-14 -18 -4 -34 q6 14 4 34z M663 248 q12 -16 6 -30 q-10 12 -6 30z" fill="#5E8C3A"/>

<!-- person from behind, centred on the screens -->
<!-- torso -->
<rect x="450" y="246" width="108" height="122" rx="34" fill="#2B3A55"/>
<path d="M472 252 q32 -16 64 0 q-8 18 -32 18 q-24 0 -32 -18z" fill="#22304A"/>
<path d="M504 270 v90" stroke="#22304A" stroke-width="2" opacity=".6"/>

<!-- head (back view) -->
<g class="head">
  <rect x="492" y="224" width="22" height="24" rx="8" fill="#B57B59"/>
  <circle cx="503" cy="206" r="30" fill="#241913"/>
  <path d="M475 210 q-2 16 10 26 q18 8 36 0 q12 -10 10 -26 q-26 10 -56 0z" fill="#1E140F"/>
  <ellipse cx="472" cy="212" rx="5" ry="8" fill="#C68E6B"/>
  <ellipse cx="534" cy="212" rx="5" ry="8" fill="#C68E6B"/>
</g>

<!-- right arm on the keyboard -->
<path d="M548 270 L574 302 L598 268" stroke="#2B3A55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="600" cy="266" r="7" fill="#C68E6B"/>

<!-- left arm raised: hand grips the mug handle, mug tipped toward the mouth -->
<g class="sip">
  <path d="M460 270 L428 304 L430 230" stroke="#22304A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g transform="rotate(14 450 220)">
    <path d="M438 210 q-11 0 -11 10 q0 10 11 10" stroke="#ECEFE9" stroke-width="4" fill="none"/>
    <rect x="438" y="204" width="24" height="32" rx="4" fill="#ECEFE9"/>
    <rect x="438" y="211" width="24" height="5" fill="#C6F25A"/>
  </g>
  <circle cx="428" cy="222" r="7.5" fill="#B57B59"/>
  <path d="M423 218 q5 -3 10 0" stroke="#9C6748" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <g stroke="#9AA39C" stroke-width="2" fill="none" stroke-linecap="round">
    <path class="steam" d="M446 198 q-4 -6 0 -12 q4 -6 0 -12"/>
    <path class="steam s2" d="M454 198 q-4 -6 0 -12 q4 -6 0 -12"/>
    <path class="steam s3" d="M462 200 q-4 -6 0 -12 q4 -6 0 -12"/>
  </g>
</g>

<!-- chair back in front of the person -->
<rect x="460" y="318" width="88" height="54" rx="14" fill="#26302B"/>
<rect x="499" y="372" width="10" height="6" fill="#1E2722"/>
<path d="M458 378 h92" stroke="#1E2722" stroke-width="6" stroke-linecap="round"/>
<circle cx="462" cy="384" r="6" fill="#1E2722"/><circle cx="546" cy="384" r="6" fill="#1E2722"/>

<text x="64" y="404" font-family="monospace" font-size="11" fill="#56645B">// coffee first, then deploy</text>
</svg>
