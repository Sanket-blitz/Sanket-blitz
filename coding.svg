<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="A developer seen from behind, wearing glasses and sipping coffee, facing a laptop set just below a monitor">
<style>
  .type{animation:type 1.8s steps(1) infinite}
  .t2{animation-delay:.25s}.t3{animation-delay:.5s}.t4{animation-delay:.75s}.t5{animation-delay:1s}.t6{animation-delay:1.25s}
  @keyframes type{0%{opacity:.25}50%{opacity:1}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .err{animation:err 2.4s steps(1) infinite}
  @keyframes err{0%{opacity:1}50%{opacity:.15}}
  .sip{transform-origin:316px 250px;animation:sip 4s ease-in-out infinite}
  @keyframes sip{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-7deg)}}
  .head{transform-origin:300px 215px;animation:tilt 4s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-3deg) translateY(-1px)}}
  .steam{animation:steam 2.2s ease-in-out infinite}
  .s2{animation-delay:.7s}.s3{animation-delay:1.4s}
  @keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.75}100%{transform:translateY(-16px);opacity:0}}
  .spin{transform-origin:110px 92px;animation:spin 1.2s linear infinite}
  .spin2{transform-origin:110px 92px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{animation:bar 3s ease-in-out infinite}
  @keyframes bar{0%{width:0}80%,100%{width:112px}}
</style>

<rect width="800" height="420" rx="18" fill="#0B0F0D"/>
<g fill="#1A221E">
  <circle cx="40" cy="30" r="1.4"/><circle cx="220" cy="40" r="1.4"/><circle cx="700" cy="30" r="1.4"/><circle cx="760" cy="200" r="1.4"/><circle cx="60" cy="260" r="1.4"/><circle cx="200" cy="150" r="1.4"/>
</g>
<line x1="20" y1="384" x2="780" y2="384" stroke="#1F2924" stroke-width="2"/>

<!-- wall clock -->
<circle cx="110" cy="92" r="36" fill="#121915" stroke="#2C3A33" stroke-width="3"/>
<g stroke="#3A4840" stroke-width="2"><line x1="110" y1="60" x2="110" y2="66"/><line x1="110" y1="118" x2="110" y2="124"/><line x1="78" y1="92" x2="84" y2="92"/><line x1="136" y1="92" x2="142" y2="92"/></g>
<line class="spin2" x1="110" y1="92" x2="110" y2="73" stroke="#ECEFE9" stroke-width="3" stroke-linecap="round"/>
<line class="spin" x1="110" y1="92" x2="110" y2="65" stroke="#C6F25A" stroke-width="2" stroke-linecap="round"/>
<circle cx="110" cy="92" r="3" fill="#C6F25A"/>

<!-- deadline note -->
<g transform="rotate(5 694 92)">
  <rect x="656" y="62" width="78" height="60" rx="3" fill="#FFB547"/>
  <text x="695" y="87" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#2A1C05">DEADLINE</text>
  <text x="695" y="105" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#B3261E">TODAY!</text>
</g>

<!-- desk -->
<rect x="150" y="272" width="560" height="12" rx="4" fill="#2E3A33"/>
<rect x="164" y="284" width="10" height="100" fill="#24302A"/>
<rect x="686" y="284" width="10" height="100" fill="#24302A"/>

<!-- monitor -->
<rect x="372" y="44" width="264" height="164" rx="8" fill="#1C2420"/>
<rect x="382" y="54" width="244" height="144" rx="3" fill="#0F1512"/>
<rect x="494" y="208" width="20" height="20" fill="#1C2420"/>
<g font-family="monospace" font-size="10">
  <text class="type" x="394" y="74" fill="#C6F25A">def deploy():</text>
  <text class="type t2" x="408" y="90" fill="#9AA39C">run_tests()</text>
  <text class="type t3" x="408" y="106" fill="#9AA39C">build()</text>
  <text class="type t4" x="408" y="122" fill="#FFB547">push("prod")</text>
  <text class="err" x="394" y="146" fill="#FF6B5E">x 3 tests failed</text>
  <text class="type t5" x="394" y="162" fill="#9AA39C">$ git commit -m "fix"</text>
  <text class="type t6" x="394" y="178" fill="#C6F25A">$ retrying...</text>
</g>
<rect class="blink" x="478" y="170" width="7" height="10" fill="#C6F25A"/>

<!-- laptop, just below the monitor -->
<rect x="424" y="196" width="160" height="70" rx="6" fill="#2A3530"/>
<rect x="432" y="203" width="144" height="56" rx="2" fill="#0F1512"/>
<g font-family="monospace" font-size="8.5">
  <text x="440" y="217" fill="#9AA39C">pipeline: run #42</text>
  <text x="440" y="231" fill="#7DD3FC">deploying to prod</text>
</g>
<rect x="440" y="240" width="112" height="6" rx="3" fill="#1C2420"/>
<rect class="bar" x="440" y="240" width="112" height="6" rx="3" fill="#C6F25A"/>
<path d="M410 266 H598 L606 272 H402 Z" fill="#3A4840"/>

<!-- plant -->
<rect x="626" y="248" width="26" height="24" rx="4" fill="#3A4840"/>
<path d="M639 248 q-14 -18 -4 -34 q6 14 4 34z M639 248 q12 -16 6 -30 q-10 12 -6 30z" fill="#5E8C3A"/>

<!-- person from behind -->
<!-- torso -->
<rect x="248" y="222" width="108" height="140" rx="34" fill="#2B3A55"/>
<path d="M270 228 q32 -16 64 0 q-8 18 -32 18 q-24 0 -32 -18z" fill="#22304A"/>
<path d="M302 246 v100" stroke="#22304A" stroke-width="2" opacity=".6"/>

<!-- head (back view) -->
<g class="head">
  <rect x="290" y="200" width="22" height="24" rx="8" fill="#B57B59"/>
  <circle cx="301" cy="182" r="30" fill="#241913"/>
  <path d="M273 186 q-2 16 10 26 q18 8 36 0 q12 -10 10 -26 q-26 10 -56 0z" fill="#1E140F"/>
  <ellipse cx="270" cy="188" rx="5" ry="8" fill="#C68E6B"/>
  <ellipse cx="332" cy="188" rx="5" ry="8" fill="#C68E6B"/>
  <!-- spectacles: temple arms over both ears, frame edges just visible -->
  <path d="M276 183 L264 182 L262 194" stroke="#AEB8B1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 183 L338 182 L340 194" stroke="#AEB8B1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- right arm resting toward the keyboard -->
<path d="M346 246 L372 290 L412 270" stroke="#2B3A55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="414" cy="270" r="7" fill="#C68E6B"/>

<!-- left arm raised, sipping coffee -->
<g class="sip">
  <path d="M258 246 L228 290 L246 222" stroke="#22304A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="226" y="190" width="26" height="30" rx="4" fill="#ECEFE9"/>
  <path d="M226 198 q-10 0 -10 9 q0 9 10 9" stroke="#ECEFE9" stroke-width="3.5" fill="none"/>
  <rect x="226" y="196" width="26" height="5" fill="#C6F25A"/>
  <circle cx="248" cy="220" r="7" fill="#B57B59"/>
  <g stroke="#9AA39C" stroke-width="2" fill="none" stroke-linecap="round">
    <path class="steam" d="M234 184 q-4 -6 0 -12 q4 -6 0 -12"/>
    <path class="steam s2" d="M242 184 q-4 -6 0 -12 q4 -6 0 -12"/>
    <path class="steam s3" d="M250 184 q-4 -6 0 -12 q4 -6 0 -12"/>
  </g>
</g>

<!-- chair back in front of the person -->
<rect x="258" y="300" width="88" height="62" rx="14" fill="#26302B"/>
<rect x="296" y="362" width="10" height="12" fill="#1E2722"/>
<path d="M256 378 h90" stroke="#1E2722" stroke-width="6" stroke-linecap="round"/>
<circle cx="260" cy="384" r="6" fill="#1E2722"/><circle cx="342" cy="384" r="6" fill="#1E2722"/>

<text x="40" y="408" font-family="monospace" font-size="11" fill="#56645B">// coffee first, then deploy</text>
</svg>
