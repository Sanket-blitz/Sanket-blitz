<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="A developer coding at a desk under deadline pressure">
<style>
  .type{animation:type 1.6s steps(1) infinite}
  .t2{animation-delay:.2s}.t3{animation-delay:.4s}.t4{animation-delay:.6s}.t5{animation-delay:.8s}.t6{animation-delay:1s}
  @keyframes type{0%{opacity:.25}50%{opacity:1}}
  .hand{animation:tap .28s ease-in-out infinite alternate}
  .hand2{animation:tap .28s ease-in-out .14s infinite alternate}
  @keyframes tap{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  .sweat{animation:drip 1.6s ease-in infinite}
  @keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(22px);opacity:0}}
  .spin{transform-origin:140px 96px;animation:spin 1.2s linear infinite}
  .spin2{transform-origin:140px 96px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .err{animation:err 2.4s steps(1) infinite}
  @keyframes err{0%{opacity:1}50%{opacity:.15}}
  .steam{animation:steam 2.2s ease-in-out infinite}
  .s2{animation-delay:.7s}.s3{animation-delay:1.4s}
  @keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
  .stress{animation:stress .5s steps(1) infinite}
  @keyframes stress{50%{opacity:0}}
  .head{animation:bob 2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(1.5px)}}
</style>

<rect width="800" height="420" rx="18" fill="#0B0F0D"/>
<g fill="#1A221E">
  <circle cx="40" cy="30" r="1.4"/><circle cx="90" cy="180" r="1.4"/><circle cx="210" cy="40" r="1.4"/><circle cx="460" cy="30" r="1.4"/><circle cx="560" cy="70" r="1.4"/><circle cx="770" cy="150" r="1.4"/><circle cx="60" cy="300" r="1.4"/><circle cx="420" cy="120" r="1.4"/>
</g>
<line x1="20" y1="380" x2="780" y2="380" stroke="#1F2924" stroke-width="2"/>

<!-- wall clock -->
<circle cx="140" cy="96" r="38" fill="#121915" stroke="#2C3A33" stroke-width="3"/>
<g stroke="#3A4840" stroke-width="2"><line x1="140" y1="62" x2="140" y2="68"/><line x1="140" y1="124" x2="140" y2="130"/><line x1="106" y1="96" x2="112" y2="96"/><line x1="168" y1="96" x2="174" y2="96"/></g>
<line class="spin2" x1="140" y1="96" x2="140" y2="76" stroke="#ECEFE9" stroke-width="3" stroke-linecap="round"/>
<line class="spin" x1="140" y1="96" x2="140" y2="68" stroke="#C6F25A" stroke-width="2" stroke-linecap="round"/>
<circle cx="140" cy="96" r="3" fill="#C6F25A"/>

<!-- deadline sticky note -->
<g transform="rotate(-6 440 72)">
  <rect x="402" y="40" width="80" height="62" rx="3" fill="#FFB547"/>
  <text x="442" y="66" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#2A1C05">DEADLINE</text>
  <text x="442" y="84" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#B3261E">TODAY!</text>
</g>

<!-- chair -->
<rect x="232" y="196" width="14" height="104" rx="7" fill="#26302B"/>
<rect x="236" y="290" width="92" height="12" rx="6" fill="#26302B"/>
<rect x="278" y="302" width="8" height="50" fill="#1E2722"/>
<path d="M244 356h80" stroke="#1E2722" stroke-width="6" stroke-linecap="round"/>
<circle cx="248" cy="366" r="7" fill="#1E2722"/><circle cx="320" cy="366" r="7" fill="#1E2722"/>

<!-- legs -->
<path d="M296 288 L366 292" stroke="#1C2333" stroke-width="20" stroke-linecap="round"/>
<path d="M366 292 L368 366" stroke="#1C2333" stroke-width="18" stroke-linecap="round"/>
<ellipse cx="380" cy="372" rx="18" ry="7" fill="#ECEFE9"/>

<!-- desk -->
<rect x="340" y="250" width="430" height="12" rx="4" fill="#2E3A33"/>
<rect x="352" y="262" width="10" height="118" fill="#24302A"/>
<rect x="748" y="262" width="10" height="118" fill="#24302A"/>

<!-- torso (hoodie) -->
<rect x="262" y="192" width="62" height="102" rx="26" fill="#2B3A55"/>
<path d="M300 196 q8 30 2 60" stroke="#22304A" stroke-width="3" fill="none"/>

<!-- head -->
<g class="head">
  <circle cx="300" cy="166" r="25" fill="#C68E6B"/>
  <path d="M276 160 q2 -30 30 -28 q22 2 20 22 q-12 -8 -26 -6 q-14 2 -24 12z" fill="#241913"/>
  <path d="M284 176 q4 18 22 18 q14 0 18 -12 q-4 6 -12 4 q-10 -2 -14 4 q-8 -2 -14 -14z" fill="#241913"/>
  <circle cx="290" cy="168" r="5" fill="#B57B59"/>
  <circle cx="314" cy="162" r="2.4" fill="#141414"/>
  <path d="M309 154 l9 -2" stroke="#241913" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sweat drop -->
  <path class="sweat" d="M326 148 q4 6 0 9 q-4 -3 0 -9z" fill="#7DD3FC"/>
  <!-- stress marks -->
  <g class="stress" stroke="#FF6B5E" stroke-width="2.5" stroke-linecap="round">
    <line x1="296" y1="128" x2="292" y2="118"/><line x1="308" y1="126" x2="310" y2="115"/><line x1="320" y1="132" x2="328" y2="124"/>
  </g>
</g>

<!-- arms -->
<path d="M306 214 L346 248 L398 242" stroke="#2B3A55" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M290 220 L336 252 L384 246" stroke="#22304A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle class="hand" cx="402" cy="242" r="7" fill="#C68E6B"/>
<circle class="hand2" cx="388" cy="245" r="6.5" fill="#B57B59"/>

<!-- laptop -->
<rect x="378" y="244" width="94" height="6" rx="2" fill="#3A4840"/>
<path d="M462 246 L478 180 L486 180 L470 246z" fill="#4A5A51"/>
<path d="M468 244 L482 186" stroke="#C6F25A" stroke-width="1.5" opacity=".6"/>

<!-- cable laptop to monitor -->
<path d="M470 250 C520 262 560 262 606 250" stroke="#3A4840" stroke-width="3" fill="none"/>

<!-- monitor -->
<rect x="500" y="92" width="232" height="146" rx="8" fill="#1C2420"/>
<rect x="510" y="102" width="212" height="122" rx="3" fill="#0F1512"/>
<rect x="606" y="238" width="20" height="12" fill="#1C2420"/>
<rect x="584" y="246" width="64" height="5" rx="2" fill="#1C2420"/>
<g font-family="monospace" font-size="9">
  <text class="type" x="518" y="118" fill="#C6F25A">def deploy():</text>
  <text class="type t2" x="530" y="132" fill="#9AA39C">run_tests()</text>
  <text class="type t3" x="530" y="146" fill="#9AA39C">build()</text>
  <text class="type t4" x="530" y="160" fill="#FFB547">push("prod")</text>
  <text class="err" x="518" y="182" fill="#FF6B5E">x 3 tests failed</text>
  <text class="type t5" x="518" y="196" fill="#9AA39C">$ git commit -m "fix"</text>
  <text class="type t6" x="518" y="210" fill="#C6F25A">$ retrying...</text>
</g>
<rect class="blink" x="586" y="203" width="6" height="9" fill="#C6F25A"/>

<!-- coffee mugs -->
<g fill="#ECEFE9">
  <rect x="672" y="226" width="20" height="24" rx="3"/><path d="M692 232 q8 0 8 7 q0 7 -8 7" stroke="#ECEFE9" stroke-width="3" fill="none"/>
  <rect x="704" y="232" width="18" height="18" rx="3" fill="#C6F25A"/>
  <rect x="730" y="226" width="20" height="24" rx="3" fill="#7DD3FC"/>
</g>
<g stroke="#9AA39C" stroke-width="2" fill="none" stroke-linecap="round">
  <path class="steam" d="M678 220 q-4 -6 0 -12 q4 -6 0 -12"/>
  <path class="steam s2" d="M686 220 q-4 -6 0 -12 q4 -6 0 -12"/>
  <path class="steam s3" d="M740 220 q-4 -6 0 -12 q4 -6 0 -12"/>
</g>

<text x="40" y="404" font-family="monospace" font-size="11" fill="#56645B">// shipping it anyway</text>
</svg>
